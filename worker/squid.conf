http_port 3128 ssl-bump cert=/tmp/ca.pem key=/tmp/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /tmp/ssl_db -M 4MB
sslproxy_cert_error deny all
acl step1 at_step SslBump1
acl provider_sni ssl::server_name --client-requested api.anthropic.com
ssl_bump peek step1
ssl_bump bump provider_sni
ssl_bump terminate all
acl connect method CONNECT
acl post method POST
acl https proto HTTPS
acl tls port 443
acl provider dstdomain -n api.anthropic.com
acl inference urlpath_regex ^/v1/messages(\?beta=true)?$ ^/v1/messages/count_tokens(\?beta=true)?$
acl nonglobal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/0
http_access deny !tls
http_access deny !provider
http_access deny nonglobal
http_access allow connect provider
http_access allow https post inference provider
http_access deny all
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 0 seconds
visible_hostname reviewer-egress
forwarded_for delete
via off
pinger_enable off
